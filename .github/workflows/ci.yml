name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, Vet, Test, Race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查（gofmt）
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查（go vet）
        run: go vet ./...

      - name: 单元测试
        # 世界生成/网络集成测试在共享 CI runner 上会因包并行而明显变慢；
        # 保留默认 10 分钟容易把“慢”误报成“挂死”。真实死锁仍会在超时后失败。
        run: go test -count=1 -timeout=20m ./...

      - name: 数据竞争检测
        run: go test -race -count=1 -timeout=20m ./...

      - name: 构建
        run: go build ./...

  build-matrix:
    name: Cross Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
